services:
  app:
    image: funish/nexus:latest
    restart: unless-stopped
    network_mode: host
    environment:
      # WinGet client-visible source identifier and upstream locations
      WINGET_SOURCE_IDENTIFIER: ${WINGET_SOURCE_IDENTIFIER:-Funish.Nexus}
      WINGET_SOURCE_MSIX_URL: ${WINGET_SOURCE_MSIX_URL:-https://cdn.winget.microsoft.com/cache/source.msix}
      WINGET_GITHUB_REPO: ${WINGET_GITHUB_REPO:-microsoft/winget-pkgs}
      WINGET_GITHUB_BRANCH: ${WINGET_GITHUB_BRANCH:-master}

      # CDN upstream registry URLs (defaults shown; point at private mirrors if needed)
      NPM_REGISTRY_URL: ${NPM_REGISTRY_URL:-https://registry.npmjs.org}
      JSR_REGISTRY_URL: ${JSR_REGISTRY_URL:-https://npm.jsr.io}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      CDNJS_API_BASE_URL: ${CDNJS_API_BASE_URL:-https://api.cdnjs.com}

      # GitHub Token for WinGet manifest access (optional, increases API rate limit)
      GITHUB_TOKEN: ${GITHUB_TOKEN}

      # S3 Storage Configuration (optional, for persistent caching)
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}

      # Local cache directory (filesystem storage fallback)
      CACHE_DIR: ${CACHE_DIR:-/data/.cache}

      # Server
      PORT: ${PORT:-3000}
    volumes:
      - nexus-cache:/data/.cache
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-3000}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  nexus-cache:
